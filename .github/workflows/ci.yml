name: CI
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify README.md exists and is non-empty
        run: |
          if [ ! -f README.md ]; then
            echo "README.md not found"
            exit 1
          fi
          if [ ! -s README.md ]; then
            echo "README.md is empty"
            exit 1
          fi
          echo "README.md exists and has content"

      - name: Run markdown lint (optional, non-blocking)
        continue-on-error: true
        run: |
          if command -v npx >/dev/null 2>&1; then
            npx --yes markdownlint-cli README.md || true
          else
            echo "markdownlint-cli not available, skipping"
          fi
